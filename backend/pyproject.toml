[project]
name = "r6-replay-server"
version = "0.1.0"
description = "Receives Rainbow Six Siege .rec replays, parses them, and lets the phone collect and acknowledge them."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.18",
    "httpx>=0.28",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-timeout>=2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 120
